server:
  port: 8081

spring:
  application:
    name: friday-class-backend
  # 默认走 local profile（密钥等敏感配置放 application-local.yml，已 gitignore）；生产用 SPRING_PROFILES_ACTIVE 覆盖
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mysql://localhost:3306/friday_class?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    # 密码不写死（避免提交到公开仓库）：本地用环境变量 DB_PASSWORD，或激活 local profile 读 application-local.yml（已 gitignore）
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 表结构由 db/schema.sql 统一管理，JPA 不自动建表
      ddl-auto: none
    open-in-view: false
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      # 单个课件上限 50MB；同时限制整个请求，双保险
      max-file-size: 50MB
      max-request-size: 55MB

# JWT 配置：密钥绝不硬编码（会提交到公开仓库）。
# 本地开发：在 application-local.yml 配 jwt.secret（已 gitignore）；
# 生产：用环境变量 JWT_SECRET 注入。启动时会校验密钥非空且长度 >= 32 字节。
jwt:
  secret: ${JWT_SECRET:}
  expire-ms: 604800000   # 令牌有效期 7 天

# DeepSeek 大模型配置（API key 用环境变量注入，不写进公开配置）
# 注意：服务端只提供 deepseek-flash / deepseek-v4-pro 两个模型 ID，
# 没有 deepseek-v4-flash 这个 ID（写错会导致每次调用直接 400）。
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com
  model: deepseek-flash

# 课件与幻灯片存储根目录（相对路径基于启动目录）。
# 该目录已在 .gitignore 中忽略，不会提交到仓库。
app:
  storage:
    root: ${STORAGE_ROOT:./storage}
  ai:
    # 同时进行的模型调用数（页级并发）。
    # 实测单次调用约 2 秒：一份 79 页的课件顺序解析要 2.5 分钟以上，并发 3 路约 1 分钟。
    # 调得更高对单份课件的提速有限，却更容易触发服务端 429 限流。
    page-concurrency: ${AI_PAGE_CONCURRENCY:3}
    # 带进提示词的会话历史轮数（一条问答记录 = 一轮）。
    # 这是**兜底**不是优化：防止会话无限增长把模型上下文撑爆。
    # 调大 = 上下文更完整但更贵；0 = 完全不带历史（等价于退回改造前的行为）。
    context-turns: ${AI_CONTEXT_TURNS:6}
    # 同时进行的 AI 智能体任务数。单独一个池，不与解析/总结共用（理由见 AiExecutorConfig）。
    # 每个任务会连续调 3~7 次模型，所以这个数直接乘在 token 账单上，默认压得很低。
    agent-concurrency: ${AI_AGENT_CONCURRENCY:2}
    # 一次任务最多几轮工具调用。超过就停下并标成 LIMIT（不是静默截断）。
    # 做成可配置主要是为了**能测**：单元测试用一个上限 2 的实例来构造边界，
    # 而不必靠真实模型去撞上限 —— 那测的是模型的心情，不是代码。
    agent-max-steps: ${AI_AGENT_MAX_STEPS:6}
  ws:
    # WebSocket 允许的来源模式（逗号分隔）。默认放行本机任意端口——
    # 不写死端口是刻意的：SecurityConfig 的 CORS 写死了 5173，
    # 前端一换端口就会 403，这里不重复那个坑。
    # ⚠️ 部署到真实域名时必须覆盖此项，否则浏览器会因 Origin 不匹配而连不上。
    allowed-origin-patterns: ${APP_WS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

logging:
  level:
    com.fridayclass: debug
